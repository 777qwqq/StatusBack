name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Theos
        uses: Randomblock1/theos-action@preview

      - name: Package rootless
        shell: bash
        run: |
          set -eu
          export THEOS_PACKAGE_SCHEME=rootless
          export PACKAGE_VERSION="${{ steps.version.outputs.version }}"
          make package FINALPACKAGE=1
          ls -l packages

      - name: Collect deb
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          DEB=$(ls -t packages/*.deb | head -1)
          cp "$DEB" "dist/com.catpaw.statusback_${{ steps.version.outputs.version }}_iphoneos-arm.deb"
          ls -l dist

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: com.catpaw.statusback_${{ steps.version.outputs.version }}_iphoneos-arm.deb
          path: dist/com.catpaw.statusback_${{ steps.version.outputs.version }}_iphoneos-arm.deb
          if-no-files-found: error

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "$GITHUB_REF_NAME" \
            --notes "StatusBack ${{ github.ref_name }}"
